# Perfil de laminado de PrusaSlicer: AnkerMake M5 + PETG, calidad 0.20 mm.
# Tarea F1.12. Distinto de config/printers/ankermake_m5_petg.yaml, que son
# HOLGURAS para diseñar; esto es cómo se lamina.
#
# ORIGEN: derivado del perfil comunitario AnkerMake CE para PrusaSlicer,
#   https://github.com/Ankermgmt/prusaslicer-ankermake-ce-profiles
#   commit 6613e900fffa, archivo vendor/AnkerMakeCE.ini
#   Presets resueltos (herencia aplanada):
#     printer:  AnkerMake-CE M5 (0.4mm nozzle)
#     filament: Generic PETG @ANKER-CE
#     print:    0.20mm NORMAL @ANKER-CE
#   Licencia del original: AGPL-3.0. Este archivo es una obra derivada y
#   hereda esa licencia.
#
# ⚠️ NO VERIFICADO EN LA IMPRESORA. El G-code de inicio (start_gcode) viene
# del perfil comunitario, no de AnkerMake Studio ni de una prueba real. Antes
# de mandar a la M5 un G-code generado con este perfil, revisa el inicio:
# un start_gcode incorrecto puede calentar mal o chocar la boquilla con la
# cama. Pasa a verificado cuando una impresión real salga bien.
#
# Se usa con:  prusa-slicer --load config/slicing/ankermake_m5_petg.ini ...

bed_shape = 0x0,235x0,235x235,0x235
bed_temperature = 80
bottom_fill_pattern = monotonic
bottom_solid_layers = 4
bottom_solid_min_thickness = 0.50
bridge_acceleration = 500
bridge_fan_speed = 50
