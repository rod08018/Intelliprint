# Modelos y política de escalamiento.
# Ver SISTEMA_MULTIAGENTE.md § 6 y DECISIONES.md ADR-007.
#
# Cambiar de modelo o de perfil NO debe requerir tocar código.

providers:
  local:
    base_url: http://ollama:11434
  deepseek:
    api_key_env: DEEPSEEK_API_KEY        # requerida; si falta, el escalamiento se desactiva
    base_url_env: DEEPSEEK_BASE_URL      # opcional
    base_url_default: https://api.deepseek.com
    model_env: DEEPSEEK_MODEL            # opcional
    model_default: deepseek-chat         # o deepseek-reasoner

# Perfiles de hardware. El activo se elige con INTELLIPRINT_PROFILE.
profiles:

  prod:                                  # PC con RTX 5090 (32 GB VRAM)
    design: local/qwen3.8                #   27B, tools + thinking + vision — 16.5 GB
    reason: local/qwen3.8                #   el mismo, con thinking activado (Mechanism Designer)
    qa:     local/gemma3:12b             #   revisor distinto, con visión   — ~8 GB
    embed:  local/nomic-embed-text       #                                  — ~0.3 GB
    # Total ~25 GB de 32 GB. Requiere OLLAMA_MAX_LOADED_MODELS=2.
    # La 5090 es Blackwell (sm_120): CUDA 12.8+ y Ollama reciente.
    # Una versión antigua NO falla, cae a CPU en silencio. Verificar en F0.3.

  dev:                                   # portátil sin GPU: DeepSeek en la nube
    design: deepseek/deepseek-chat
    reason: deepseek/deepseek-reasoner   # razonamiento espacial: Mechanism Designer (F3.15 (mecanismos))
    qa:     deepseek/deepseek-chat       # sin diversidad de modelo: ver abajo
    embed:  null                         # DeepSeek no ofrece embeddings

    # ⚠️ PERFIL TEMPORAL DE DESARROLLO. Migrar a `prod` en el PC con la 5090:
    #        design: local/qwen3.8        (27B, con visión)
    #        qa:     local/gemma3:12b     (revisor distinto, con visión)
    #
    # Qué NO se puede desarrollar ni probar con este perfil:
    #
    #   1. Capa 3 del QA (§ 7.1). DeepSeek no tiene visión, así que no puede
    #      mirar los renders. Las capas 1 y 2 son deterministas y sí se
    #      prueban enteras; la de visión necesita qwen3.8 o gemma3.
    #   2. RAG sobre la API de FreeCAD (F2.19, solo escotilla). Sin `nomic-embed-text` no hay
    #      embeddings; requiere Ollama aunque el resto vaya por la nube.
    #   3. Diversidad de modelo en el QA: diseñador y revisor son el mismo.
    #      No rompe la corrección —el veredicto es aritmético (ADR-003)—
    #      pero se pierde la segunda red.
    #   4. Cualquier medida de rendimiento. La latencia de red no dice nada
    #      sobre lo que tardará el modelo local.
    #
    # Y una advertencia sobre cómo leer los resultados: `deepseek-chat` es
    # mejor que `qwen3.8` siguiendo esquemas. Si una receta o una spec falla
    # la validación AQUÍ, en local fallará más. Es un suelo optimista: sirve
    # para descartar problemas, no para dar nada por bueno.

active_profile_env: INTELLIPRINT_PROFILE
active_profile_default: dev

# Los agentes referencian roles del perfil, nunca modelos concretos.
agents:
  requirements:   {model: $design}
  decomposition:  {model: $design, escalate_to: deepseek, escalate_after_failures: 1}
  kinematics:     {model: $design}
  mechanism:      {model: $reason}       # con deepseek-chat no cerró la bisagra en 3 rondas
  actuation:      {model: $design}
  electronics:    {model: $design}
  part_designer:  {model: $design, escalate_to: deepseek, escalate_after_failures: 2}
  tolerances:     {model: $design}
  qa:             {model: $qa}           # sin escalamiento: el veredicto no es del LLM (§ 7.1)
  assembly:       {model: $design}
  test_sim:       {model: $design}
  slicing:        {model: $design}
  default:        {model: $design, escalate_to: deepseek, escalate_after_failures: 2}

# Precios por millón de tokens, para el tope de gasto (F5.12 (tope)). Cambian con el
# proveedor: por eso viven aquí y no en el código. Un modelo sin precio no
# cuenta para el tope (los locales no cuestan dinero).
#
# Comprobado contra api-docs.deepseek.com el 2026-09-20. Dos cosas que no se
# veían desde aquí:
#
# 1. `deepseek-chat` y `deepseek-reasoner` YA NO SON MODELOS: son alias que
#    DeepSeek mantiene desde que los retiró el 2026-07-24. A los dos los sirve
#    `deepseek-flash` (V4.1 Flash); `chat` con el pensamiento apagado y
#    `reasoner` con él encendido. Comprobado llamándolos: la respuesta dice
#    `"model": "deepseek-flash"`. Así que se cobran como Flash.
#
# 2. Estos precios eran 0.28 / 0.42 y la salida real cuesta 1.20 en hora punta
#    y 0.60 fuera de ella. En este sistema casi todo el gasto es SALIDA —el
#    razonador piensa decenas de miles de tokens—, así que el coste salía entre
#    1.4 y 2.9 veces corto, y el tope de «2 USD» dejaba gastar hasta unos 5.
#
# Se usa el precio de HORA PUNTA (01-04 y 06-10 UTC, laborables): para un tope
# de gasto, equivocarse hacia arriba es lo seguro. Fuera de punta, la mitad.
pricing:
  deepseek-chat:     {in_usd_per_mtok: 0.30, out_usd_per_mtok: 1.20}
  deepseek-reasoner: {in_usd_per_mtok: 0.30, out_usd_per_mtok: 1.20}
  deepseek-flash:    {in_usd_per_mtok: 0.30, out_usd_per_mtok: 1.20}
  deepseek-v4-pro:   {in_usd_per_mtok: 1.32, out_usd_per_mtok: 3.96}

escalation:
  max_usd_per_project: 2.0
  max_context_tokens_local: 16000
  # La escotilla de Python libre (§ 6.3) usa SIEMPRE deepseek, no el modelo local.
  hatch_provider: deepseek
