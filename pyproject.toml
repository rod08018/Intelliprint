[project]
name = "intelliprint"
version = "0.1.0"
description = "Sistema multiagente local para diseñar piezas imprimibles en 3D"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
]

[project.scripts]
intelliprint = "orchestrator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "mcp/mech-toolkit", "mcp/sim"]
# Los tests `gui` abren la interfaz real de FreeCAD y los `llm` llaman a un
# modelo de verdad (cuestan dinero). Fuera de la suite rápida; se ejecutan
# con `pytest -m "gui or llm"` antes de cerrar una tarea que toque FreeCAD,
# el laminado o un agente (F1.17).
addopts = "-q -m 'not gui and not llm'"
markers = [
    "gui: abre la interfaz gráfica de FreeCAD (lento, abre ventanas)",
    "llm: llama a un modelo de lenguaje real (lento, cuesta dinero)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# mech_toolkit vive en mcp/mech-toolkit/ porque será un servicio aparte
# (F2.1); hasta entonces se instala junto al orquestador.
where = [".", "mcp/mech-toolkit", "mcp/sim"]
include = ["orchestrator*", "mech_toolkit*", "sim*"]
