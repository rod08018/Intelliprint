nombre: pan_tilt_sg90
categoria: robots
obra: true
peticion: >
  Un pan-tilt con dos servos SG90: el de abajo gira y el de arriba inclina una
  plataforma para una cámara pequeña. Cada uno recorre 180° (90° a cada lado)
  sin que nada choque.
oraculo:
  - tipo: componente
    ficha: sg90
    cuantos: 2
  - tipo: encaje
  - tipo: conjunto_libre
  - tipo: articulaciones
    ejes: [vertical, horizontal]
    recorrido_grados: 180
  - tipo: sin_soportes
  # «Inclina una plataforma para una cámara pequeña»: lo que el servo de
  # arriba mueve tiene que llevar la cámara de forma que cambie de
  # orientación al inclinar. Una cámara pequeña de verdad mide 25 × 24 mm
  # (módulo de cámara de Raspberry Pi, «Around 25 × 24 × 9 mm»,
  # raspberrypi.com/documentation/accessories/camera.html): ese rectángulo
  # tiene que caber en una cara plana con la normal perpendicular al eje de
  # inclinación. La corrida 1111-1342 pasó las cinco exigencias de arriba con
  # un disco centrado en ese eje, que gira sobre sí mismo (añadida el
  # 2026-11-11, a petición del usuario). Primero se pidieron 600 mm² de área;
  # ese mismo día, con su visto bueno, pasó a pedir que quepa: la placa de
  # 32 × 22 que salió al reanudar tiene 704 mm² y la cámara no cabe.
  - tipo: se_orienta
    eje: horizontal
    cabe_mm: [25, 24]
  # Cada SG90 se sujeta con los dos tornillos que trae, uno por oreja
  # (`library/components/sg90.yaml`: dos fijaciones, M2, incluidas): 2 servos
  # × 2 = 4. Tienen que estar y agarrar: su agujero, más estrecho que ellos.
  # La corrida 1111-1342 pasó las seis exigencias de arriba con el servo de
  # la base sin agujeros bajo las orejas y el del soporte con dos de Ø2.2
  # (añadida el 2026-11-11 con F9.6 (previsto), en el plan aprobado ese día).
  - tipo: tornillos
    sujetan: sg90
    metrica: M2
    cuantos: 4
