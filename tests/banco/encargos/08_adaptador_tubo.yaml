nombre: adaptador_tubo
categoria: casa
peticion: >
  Adaptador para unir un tubo de 32 mm de diámetro exterior con otro de 25 mm
  de diámetro exterior (aspiradora). Cada tubo entra 20 mm dentro del
  adaptador, con pared de 2.5 mm.
oraculo:
  - tipo: cilindro
    interior: true
    nominal_mm: 32
    diametro_min_mm: 32.1
    diametro_max_mm: 32.8
  - tipo: cilindro
    interior: true
    nominal_mm: 25
    diametro_min_mm: 25.1
    diametro_max_mm: 25.8
  - tipo: envolvente
    min_mm: [40, 37, 37]
    porque: los dos tubos entran 20 mm cada uno; Ø32 más dos paredes de 2.5 da 37
  - tipo: sin_soportes
  - tipo: coaxiales
    diametros_mm: [[32.1, 32.8], [25.1, 25.8]]
    porque: los dos tubos tienen que quedar en línea
  - tipo: paso_libre
    diametro_mm: 20
    eje_de_mm: [32.1, 32.8]
    porque: >
      el aire no se estrecha de golpe: un tubo de 25 de diámetro exterior
      tiene unos 21 por dentro, así que por el adaptador tiene que pasar al
      menos un Ø20 de punta a punta
