nombre: soporte_sg90
categoria: robots
peticion: >
  Soporte para un micro servo SG90 sobre la placa de un robot. El servo mide
  22.8 x 12.2 mm y se atornilla por sus orejetas con dos tornillos de rosca
  directa, en agujeros de 2 mm separados 27.8 mm. La placa del robot tiene
  agujeros M3 en cuadro de 20 mm: el soporte lleva 4 agujeros de 3.3 mm en
  cuadro de 20 mm para fijarlo.
oraculo:
  - tipo: componente
    ficha: sg90
  - tipo: agujeros
    diametro_mm: 2
    patron_mm: [[0, 0], [27.8, 0]]
  - tipo: agujeros
    diametro_mm: 3.3
    patron_mm: [[0, 0], [20, 0], [0, 20], [20, 20]]
  - tipo: sin_soportes
  - tipo: ventana
    ancho_mm: 22.8
    alto_mm: 12.2
    porque: el cuerpo del servo pasa por su ventana
  - tipo: aristas_vivas
    max_fraccion: 0.1
    porque: >
      se ve como un producto y no como un prototipo: como mucho un 10 % de
      las aristas entre caras planas queda en esquina viva, sin redondear ni
      achaflanar
