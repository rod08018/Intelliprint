nombre: soporte_mg996r_2020
categoria: robots
peticion: >
  Soporte para fijar un servo MG996R a un perfil de aluminio 2020. El cuerpo
  del servo mide 40.7 x 19.7 mm y se atornilla por sus orejetas con 4
  tornillos M3: agujeros de 3.3 mm con centros en un rectángulo de 49.5 x 10 mm.
  Al perfil va con 2 tornillos M5, agujeros de 5.5 mm separados 20 mm.
  Que se imprima sin soportes.
oraculo:
  - tipo: agujeros
    diametro_mm: 3.3
    patron_mm: [[0, 0], [49.5, 0], [0, 10], [49.5, 10]]
  - tipo: agujeros
    diametro_mm: 5.5
    patron_mm: [[0, 0], [20, 0]]
  - tipo: sin_soportes
  - tipo: ventana
    ancho_mm: 40.7
    alto_mm: 19.7
    porque: el cuerpo del servo pasa por su ventana
  - tipo: pared_minima
    min_mm: 1.8
    porque: >
      un soporte que aguanta un servo de 55 g tirando de un brazo lleva
      paredes estructurales: 1.8 mm, cuatro perímetros de 0.42 en la M5
  - tipo: aristas_vivas
    max_fraccion: 0.1
    porque: >
      se ve como un producto y no como un prototipo: como mucho un 10 % de
      las aristas entre caras planas queda en esquina viva, sin redondear ni
      achaflanar
