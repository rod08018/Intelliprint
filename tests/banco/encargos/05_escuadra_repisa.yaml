nombre: escuadra_repisa
categoria: casa
peticion: >
  Escuadra para una repisa de madera de 200 mm de fondo que tiene que aguantar
  5 kg de libros. Se atornilla a la pared con 2 tornillos de 4 mm (agujeros de
  4.5 mm separados 60 mm) y a la repisa con otros 2 iguales, también separados
  60 mm.
oraculo:
  - tipo: agujeros
    diametro_mm: 4.5
    patron_mm: [[0, 0], [60, 0]]
  - tipo: envolvente
    min_mm: [150, 70, 15]
    porque: >
      el brazo tiene que llegar al menos a tres cuartos del fondo (150 de
      200), el ala de pared tiene que alojar dos agujeros a 60 mm, y menos de
      15 mm de ancho no aguanta 5 kg en PLA
  - tipo: sin_soportes
  - tipo: resistencia
    carga_N: 24.5
    fijacion_diametro_mm: 4.5
    direccion: entre_agujeros
    brazo: punta
    porque: >
      5 kg de libros sobre dos escuadras son 2.5 kg por escuadra (24.5 N), y
      el caso desfavorable es todo en la punta del brazo; la gravedad va en
      la línea entre los dos agujeros de la pared
  - tipo: aristas_vivas
    max_fraccion: 0.1
    porque: >
      se ve como un producto y no como un prototipo: como mucho un 10 % de
      las aristas entre caras planas queda en esquina viva, sin redondear ni
      achaflanar
