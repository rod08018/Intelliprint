nombre: clip_cable
categoria: casa
peticion: >
  Clip para sujetar un cable de 6 mm de diámetro al canto de una mesa de 18 mm
  de grosor, sin tornillos: se encaja a presión en el canto.
oraculo:
  - tipo: cilindro
    interior: true
    nominal_mm: 6
    diametro_min_mm: 6.0
    diametro_max_mm: 6.8
  - tipo: sin_soportes
  - tipo: ranura
    min_mm: 17
    max_mm: 18
    porque: >
      se encaja a presión en un canto de 18 mm: la boca tiene que ser algo
      más estrecha que 18, pero no tanto que no entre (al menos 17)
  - tipo: retencion
    diametro_min_mm: 6.0
    diametro_max_mm: 6.8
    vuelta_min_grados: 200
    porque: >
      el cable queda retenido si su alojamiento lo abraza más de media vuelta:
      la abertura por la que entra es entonces más estrecha que 6 mm
