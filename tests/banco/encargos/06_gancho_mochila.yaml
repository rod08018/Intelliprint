nombre: gancho_mochila
categoria: casa
peticion: >
  Gancho de pared para colgar una mochila de hasta 8 kg. Se atornilla con 2
  tornillos de 4 mm, agujeros de 4.5 mm separados 40 mm en vertical, y el
  gancho sobresale 50 mm de la pared.
oraculo:
  - tipo: agujeros
    diametro_mm: 4.5
    patron_mm: [[0, 0], [0, 40]]
  - tipo: envolvente
    min_mm: [50, 50, 10]
    porque: sobresale 50 mm; la placa tiene que alojar dos agujeros a 40 mm con margen
  - tipo: sin_soportes
  - tipo: resistencia
    carga_N: 78.5
    fijacion_diametro_mm: 4.5
    direccion: entre_agujeros
    brazo: punta
    porque: >
      8 kg son 78.5 N colgados en la punta del gancho, a 50 mm de la pared;
      los agujeros van en vertical, así que la gravedad va en su línea
  - tipo: aristas_vivas
    max_fraccion: 0.1
    porque: >
      la punta redondeada no engancha la tela: como mucho un 10 % de las
      aristas entre caras planas queda en esquina viva
