nombre: escuadra_nema17
categoria: robots
peticion: >
  Escuadra en L para montar un motor NEMA17 en vertical sobre una base. La
  cara del motor lleva un taladro central de 22.4 mm para el resalte y 4
  agujeros de 3.3 mm en cuadro de 31 mm. La otra ala se atornilla a la base
  con 2 tornillos M4, agujeros de 4.5 mm separados 30 mm. El motor tira de
  una correa con unos 20 N.
oraculo:
  - tipo: cilindro
    interior: true
    nominal_mm: 22.4
    diametro_min_mm: 22.3
    diametro_max_mm: 22.6
  - tipo: agujeros
    diametro_mm: 3.3
    patron_mm: [[0, 0], [31, 0], [0, 31], [31, 31]]
  - tipo: agujeros
    diametro_mm: 4.5
    patron_mm: [[0, 0], [30, 0]]
  - tipo: sin_soportes
  - tipo: resistencia
    carga_N: 20
    fijacion_diametro_mm: 4.5
    direccion: perpendicular_al_eje
    eje_diametro_mm: 22.4
    brazo: centro
    porque: >
      la correa tira con 20 N perpendicular al eje del motor, a la altura del
      eje (el centro del taladro de 22.4), y el ala vertical trabaja en
      voladizo desde los tornillos de la base
  - tipo: aristas_vivas
    max_fraccion: 0.1
    porque: >
      se ve como un producto y no como un prototipo: como mucho un 10 % de
      las aristas entre caras planas queda en esquina viva, sin redondear ni
      achaflanar
