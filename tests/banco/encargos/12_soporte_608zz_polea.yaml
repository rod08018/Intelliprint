nombre: soporte_608zz_polea
categoria: robots
obra: true
peticion: >
  Un soporte para un rodamiento 608ZZ que se atornilla con dos M5 a un perfil
  2020, y una polea impresa que gira en ese rodamiento sobre un eje de 8 mm.
oraculo:
  - tipo: componente
    ficha: 608zz
  - tipo: encaje
  - tipo: conjunto_libre
  # «gira en ese rodamiento»: la vuelta entera, que no es una cota. Antes quedaba pendiente
  # porque la ficha del 608ZZ no tenía salida; ya la tiene (F7.4 (conjunto)).
  # El eje, cualquiera: la petición no dice en qué postura va el perfil.
  - tipo: articulaciones
    ejes: [cualquiera]
    recorrido_grados: vuelta entera
  - tipo: sin_soportes
