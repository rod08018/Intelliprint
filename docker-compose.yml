# Intelliprint en contenedores (F0.2 (docker)).
#
# Salda la deuda «todo corre nativo, no en contenedores» de PLAN_PROYECTO.md:
# hasta ahora el sistema solo existía como instalación hecha a mano en un
# ordenador —rutas absolutas, un LaunchAgent que solo existe en macOS,
# secretos copiados a mano— y nada de eso lo verificaba un test.
#
# REPARTO. FreeCAD va DENTRO: es una herramienta interna, construye y calla.
# PrusaSlicer se queda FUERA, en el PC, porque es donde la persona mira qué
# va a imprimir; el contenedor se lo pide por el puente del host, que hay
# que tener arrancado (scripts/start-host-mcps.ps1).
#
#   docker compose run --rm orchestrator mecanismo peticion.md --archivo
#   docker compose run --rm suite            # la suite rápida, en Linux
#   docker compose up -d ollama              # modelos locales con la 5090

services:

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    image: intelliprint/orchestrator:dev
    env_file: [.env]
    environment:
      # FreeCAD es el de Linux, no el .exe que el .env nombra para el host.
      FREECADCMD: /opt/freecad/usr/bin/freecadcmd
      # Vacío a propósito: aquí dentro NO hay PrusaSlicer. Si alguien
      # intentara laminar sin puente, el error tiene que decir eso y no
      # buscar un .exe de Windows que nunca va a estar.
      PRUSASLICER: ""
      INTELLIPRINT_WORKSPACE: /workspace
      # El contenedor `ollama` que ya corre en esta máquina, visto desde
      # aquí. Con el servicio `ollama` de abajo sería http://ollama:11434.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      # El trabajo de la persona. Montado, nunca copiado: lo que el sistema
      # diseña tiene que poder abrirse con el FreeCAD del escritorio, y sus
      # STL tiene que poder verlos el PrusaSlicer del PC.
      - ./workspace:/workspace
      # Los perfiles y la librería se editan a mano y deben verse al momento,
      # sin reconstruir la imagen. Solo lectura: el contenedor no los cambia.
      - ./config:/app/config:ro
      - ./library:/app/library:ro

  # La suite rápida, en el mismo contenedor donde corre el sistema.
  #
  # POR QUÉ AQUÍ Y NO EN WINDOWS: corriéndola nativa en Windows caen 19
  # tests y ninguno por un fallo del sistema. Son tres cosas del sistema
  # operativo —`open()` sin encoding se lee como cp1252 y no como UTF-8,
  # algún test llama a `/bin/sh`, y un proceso zombi no se comporta igual—.
  # El contenedor es el sitio donde la suite dice la verdad sobre el código.
  suite:
    extends:
      service: orchestrator
    entrypoint: ["python3", "-m", "pytest"]
    volumes:
      - ./workspace:/workspace
      - ./config:/app/config:ro
      - ./library:/app/library:ro
      # El código en vivo: para ver un cambio no hace falta reconstruir.
      - ./orchestrator:/app/orchestrator:ro
      - ./tests:/app/tests:ro
      - ./mcp:/app/mcp:ro
      - ./scripts:/app/scripts:ro

  # La interfaz web (F5.5 (web)): lista de proyectos, descarga en zip y el
  # botón que abre las piezas en el PrusaSlicer del escritorio.
  #
  #   http://localhost:8080
  web:
    extends:
      service: orchestrator
    entrypoint: ["python3", "-m", "orchestrator.web.app"]
    # Por defecto 127.0.0.1: solo desde este PC. La página no tiene
    # contraseña, baja cualquier proyecto y abre programas en el escritorio,
    # así que abrirla a la red es una decisión, no un valor por defecto.
    # Para entrar desde el móvil en la misma wifi: WEB_BIND=0.0.0.0 en .env,
    # y entonces la ve CUALQUIERA conectado a esa red.
    ports: ["${WEB_BIND:-127.0.0.1}:8080:8080"]
    restart: unless-stopped

  # --- Crafty: el canal humano por Telegram -----------------------------------
  #
  # Tres piezas. Intelliprint sirve su MCP por HTTP en la red interna
  # (en el Mac Crafty lo lanzaba por stdio, pero aquí el binario, FreeCAD y
  # el modelo viven en OTRA imagen). Un paso previo genera la configuración
  # de Crafty desde el .env. Y Crafty arranca con ella.
  #
  #   docker compose up -d crafty
  #
  # UN BOT, UN ORDENADOR: Telegram entrega cada mensaje una sola vez. Antes
  # de levantarlo aquí, para el Crafty del Mac (config/openclaw/README.md).

  intelliprint-mcp:
    extends:
      service: orchestrator
    entrypoint: ["intelliprint-mcp"]
    environment:
      INTELLIPRINT_MCP_TRANSPORT: streamable-http
      INTELLIPRINT_MCP_PORT: "8200"
      # El buzón de Crafty, en la MISMA ruta que dentro de su contenedor: el
      # MCP devuelve rutas y Crafty las abre tal cual.
      INTELLIPRINT_BUZON: /home/node/.openclaw/workspace/intelliprint
    volumes:
      - ./workspace:/workspace
      - ./config:/app/config:ro
      - ./library:/app/library:ro
      - crafty_buzon:/home/node/.openclaw/workspace/intelliprint
    # Sin puertos publicados: solo lo llama Crafty, por la red interna. Este
    # servidor lanza proyectos que gastan dinero; no tiene por qué verlo
    # nadie más.
    restart: unless-stopped

  crafty-config:
    extends:
      service: orchestrator
    # Sin TELEGRAM_ALLOWED_USERS esto falla, el lote no se escribe y Crafty
    # no arranca (F5.10 (lista)).
    entrypoint: ["sh", "-c", "python3 -m orchestrator.crafty > /bootstrap/lote.json"]
    volumes:
      - crafty_bootstrap:/bootstrap
    restart: "no"

  crafty:
    # Versión fijada: una actualización de OpenClaw cambia su configuración
    # y su comportamiento, y eso se decide, no se descubre un lunes.
    image: ghcr.io/openclaw/openclaw:2026.9.5
    env_file: [.env]
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      TZ: America/Guatemala
    entrypoint: ["sh", "/intelliprint/crafty-entrypoint.sh"]
    volumes:
      - crafty_estado:/home/node/.openclaw
      - crafty_buzon:/home/node/.openclaw/workspace/intelliprint:ro
      - crafty_bootstrap:/bootstrap:ro
      - ./config/openclaw:/intelliprint/openclaw:ro
      - ./docker/crafty-entrypoint.sh:/intelliprint/crafty-entrypoint.sh:ro
    # Endurecimiento que trae el compose oficial de OpenClaw.
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    init: true
    # Sin puertos: Telegram va por sondeo SALIENTE y el gateway escucha en
    # loopback. No hay nada que abrir.
    depends_on:
      crafty-config:
        condition: service_completed_successfully
      intelliprint-mcp:
        condition: service_started
    restart: unless-stopped

  # Modelos locales en la RTX 5090.
  #
  # ESTE SERVICIO NO SE LEVANTA POR DEFECTO, y no es un olvido: esta máquina
  # YA tiene un contenedor `ollama` propio, con la GPU y con qwen3.8
  # descargado. Arrancar otro sería una segunda copia de 17 GB peleando por
  # la misma tarjeta, y además el puerto 11434 ya está cogido.
  #
  # Por eso OLLAMA_URL apunta al que ya existe, a través del host. Este de
  # aquí queda para una máquina donde no haya ninguno:
  #
  #   docker compose --profile ollama up -d ollama
  #
  # Ninguno de los dos está EN USO todavía: el perfil activo sigue siendo
  # `dev` (DeepSeek). Cambiarlo es F0.11 (migrar), que además necesita el
  # cliente de Ollama; hoy cli.py sale con un error claro si el perfil no
  # es DeepSeek. Esto es lo que hace que F0.11 sea un cambio de variable y
  # no una tarde de montaje.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    environment:
      # El modelo de diseño y el del QA residentes a la vez (§ 6.1): si se
      # descargan mutuamente, cada turno paga la recarga.
      OLLAMA_MAX_LOADED_MODELS: 2
    volumes:
      - ollama:/root/.ollama
    ports: ["11434:11434"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
  crafty_estado:
  crafty_buzon:
  crafty_bootstrap:
