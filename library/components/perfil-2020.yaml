# Perfil de aluminio 2020, ranura de 6 (F6.11 (biblioteca)).
#
# No es algo que se meta en la pieza: es contra lo que se atornilla. Sirve
# para comprobar que la pieza apoya en el perfil sin atravesarlo, y que una
# lengüeta que entre en la ranura cabe.
id: perfil-2020
nombre: Perfil de aluminio 2020 (ranura de 6, M5)
alias: ["perfil 2020", "aluminio 2020", "extrusión 2020", "2020 profile", "V-slot 2020"]
verificado: false
fuentes:
  - url: https://download.lulzbot.com/TAZ/1.0/hardware/mechanical/spec_sheets/p2239.pdf
    cita: "HFS5-2020: 20 x 20, Details of slot 6 / 12 / 4 2, núcleo 8, Ø4.2, 4-R1"
  - url: https://api.uk.misumi-ec.com/vona2/detail/110302685570
    cita: "5 Series / slot width 6 / 20x20mm"
marco: >
  El perfil va a lo largo de x, de -100 a 100 (en la realidad sigue), con el
  centro de la sección en y=0, z=0. La cara de arriba está en z=10.
mira: "+z"
cuerpos:
  - nombre: núcleo
    caja: [200, 8, 8]
    en: [-100, -4, -4]
  - nombre: esquina +y+z
    caja: [200, 7, 7]
    en: [-100, 3, 3]
  - nombre: esquina -y+z
    caja: [200, 7, 7]
    en: [-100, -10, 3]
  - nombre: esquina +y-z
    caja: [200, 7, 7]
    en: [-100, 3, -10]
  - nombre: esquina -y-z
    caja: [200, 7, 7]
    en: [-100, -10, -10]
fijacion:
  - {nombre: tornillo M5 en la ranura de arriba, diametro: 5, en: [0, 0, 10], eje: "-z"}
notas: >
  Las ranuras quedan libres en 6 de ancho y 6 de fondo: por dentro se
  ensanchan a 12 (ahí va la tuerca en T M5, que no se modela). El tornillo
  puede ir en cualquier punto a lo largo de la ranura; la ficha marca uno.
  Las esquinas tienen radio 1.
